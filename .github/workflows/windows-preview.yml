name: Windows preview

# An unsigned build to try on a Windows PC: the installer and the CLI.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      # The version comes from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Installer
        working-directory: app
        run: npx tauri build --bundles nsis -- --locked

      - name: Command line tool
        run: cargo build --release --locked -p harbormaster-cli

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harbormaster-windows-preview
          path: |
            target/release/bundle/nsis/*.exe
            target/release/harbormaster.exe
          if-no-files-found: error
          retention-days: 14
