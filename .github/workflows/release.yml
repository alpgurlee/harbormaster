name: Release

# A draft release for a version tag: the macOS app and the Windows installer,
# the command line tool for each, and their checksums. Publishing the draft
# is a person's step. Started by hand, it only builds, as a rehearsal.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One version everywhere, and the tag names it.
      - name: Read the version
        id: read
        env:
          REF_NAME: ${{ github.ref_name }}
          TAGGED: ${{ github.ref_type == 'tag' }}
        run: |
          crates=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          app=$(jq -r .version app/src-tauri/tauri.conf.json)
          frontend=$(jq -r .version app/package.json)
          if [ -z "$crates" ] || [ "$crates" != "$app" ] || [ "$crates" != "$frontend" ]; then
            echo "The versions differ: crates $crates, app $app, frontend $frontend" >&2
            exit 1
          fi
          if [ "$TAGGED" = true ] && [ "$REF_NAME" != "v$crates" ]; then
            echo "The tag $REF_NAME doesn't name version $crates" >&2
            exit 1
          fi
          echo "version=$crates" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS
    needs: version
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      # The version comes from rust-toolchain.toml; a universal app needs both targets.
      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: App
        working-directory: app
        run: npx tauri build --bundles dmg --target universal-apple-darwin -- --locked

      - name: Command line tool
        run: |
          cargo build --release --locked -p harbormaster-cli --target aarch64-apple-darwin
          cargo build --release --locked -p harbormaster-cli --target x86_64-apple-darwin
          mkdir -p cli
          lipo -create -output cli/harbormaster \
            target/aarch64-apple-darwin/release/harbormaster \
            target/x86_64-apple-darwin/release/harbormaster

      - name: Gather
        run: |
          mkdir release
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            "release/Harbormaster-$VERSION-macos-universal.dmg"
          tar -czf "release/harbormaster-cli-$VERSION-macos-universal.tar.gz" -C cli harbormaster
          cd release
          shasum -a 256 -- * > SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: release/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows
    needs: version
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Installer
        working-directory: app
        run: npx tauri build --bundles nsis -- --locked

      - name: Command line tool
        run: cargo build --release --locked -p harbormaster-cli

      - name: Gather
        run: |
          mkdir release
          cp target/release/bundle/nsis/*.exe "release/Harbormaster-$VERSION-windows-x64-setup.exe"
          powershell -NoProfile -Command "Compress-Archive -Path target/release/harbormaster.exe -DestinationPath release/harbormaster-cli-$VERSION-windows-x64.zip"
          cd release
          sha256sum -- * > SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd release
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm SHA256SUMS-*.txt
          gh release create "$TAG" --draft --verify-tag --generate-notes \
            --title "Harbormaster $VERSION" -- *
