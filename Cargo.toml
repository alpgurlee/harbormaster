[workspace]
resolver = "3"
members = ["crates/platform", "crates/engine", "crates/cleaner", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/alpgurlee/harbormaster"

[workspace.dependencies]
harbormaster-platform = { path = "crates/platform" }
harbormaster-engine = { path = "crates/engine" }
harbormaster-cleaner = { path = "crates/cleaner" }
ab_glyph = "=0.2.32"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
libc = "=0.2.190"
libproc = "=0.14.11"
mach2 = "=0.7.0"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSProcessInfo", "NSString", "NSURL"] }
serde = { version = "=1.0.229", features = ["derive"] }
socket2 = "=0.6.5"
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", features = ["tray-icon", "macos-private-api"] }
tauri-build = { version = "=2.7.3", features = [] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
toml = "=1.1.8"
window-vibrancy = "=0.8.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"

# Debug info for dependencies costs gigabytes and is rarely read.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
