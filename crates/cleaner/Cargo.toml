[package]
name = "harbormaster-cleaner"
description = "Finds what a developer's machine can do without."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Reads an app bundle's Info.plist for its identifier.
[target.'cfg(target_os = "macos")'.dependencies]
plist.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile.workspace = true

# The Recycle Bin itself, which removal is tested against.
[target.'cfg(windows)'.dev-dependencies]
harbormaster-platform.workspace = true

[lints]
workspace = true
